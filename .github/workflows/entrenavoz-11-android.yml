name: Publicar APK Entrena Voz 11 - Conteo personalizado
on:
  push:
    branches: [main]
    paths:
      - 'entrenador-voz-v3/**'
      - '.github/workflows/entrenavoz-11-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Construir proyecto Android v3
        run: |
          cp -a entrenador-android entrenador-android-v3
          sed -i 's/entrenavozv2/entrenavozv3/g' entrenador-android-v3/app/build.gradle
          sed -i 's/versionCode 2/versionCode 3/' entrenador-android-v3/app/build.gradle
          sed -i "s/versionName '2.0'/versionName '3.0'/" entrenador-android-v3/app/build.gradle
          sed -i 's/entrenavozv2/entrenavozv3/g' entrenador-android-v3/app/src/main/java/cl/dacaram/entrenavozv2/MainActivity.java
          mkdir -p entrenador-android-v3/app/src/main/assets/audios/conteo
          cp entrenador-voz-v3/index.html entrenador-android-v3/app/src/main/assets/index.html
          cp entrenador-voz-v3/audios/conteo/*.mp3 entrenador-android-v3/app/src/main/assets/audios/conteo/
          test "$(find entrenador-android-v3/app/src/main/assets/audios/conteo -name '*.mp3' | wc -l)" -eq 30
      - name: Compilar APK
        run: cd entrenador-android-v3 && gradle --no-daemon assembleRelease
      - name: Firmar y verificar APK independiente
        run: |
          KEYSTORE="$RUNNER_TEMP/entrenavoz-v3.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass 'EntrenaVozV3Local' -keypass 'EntrenaVozV3Local' -alias entrenavoz3 -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=ENTRENA VOZ V3, OU=App, O=Dacaram, C=CL' -noprompt
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -v 4 entrenador-android-v3/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass 'pass:EntrenaVozV3Local' --key-pass 'pass:EntrenaVozV3Local' --ks-key-alias entrenavoz3 --out ENTRENA-VOZ-11.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose ENTRENA-VOZ-11.apk
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view entrenavoz-11 >/dev/null 2>&1; then
            gh release upload entrenavoz-11 ENTRENA-VOZ-11.apk --clobber
          else
            gh release create entrenavoz-11 ENTRENA-VOZ-11.apk --target "$GITHUB_SHA" --title "ENTRENA VOZ 11 - Conteo personalizado con tu voz" --notes "Diez ejercicios, audio maestro separado en 30 numeros, conteo por repeticion de 1 a 30 por ejercicio y favoritos, 30 segundos, 1 a 5 series, descansos de 20/30/40/60 segundos entre series. Aplicacion independiente de V2."
          fi
