<!doctype html><html lang="es"><head><meta charset="UTF-8"><script src="../../feria-config.js"></script><script src="../../feria-storage.js"></script><script src="../../pwa-guard.js"></script><link rel="stylesheet" href="../../ios-adaptaciones.css"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071725"><title>Defensa del Planeta Almendrino</title><style>
*{box-sizing:border-box}body{margin:0;background:#030912;color:#eafaff;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}button,select{font:inherit}button{cursor:pointer;border:1px solid #5bf0dd50;border-radius:14px;padding:13px 20px;background:#123446;color:white;font-weight:700}button:hover{background:#1c5061}button.primary{background:#66efcf;color:#052423;border:0;box-shadow:0 6px 30px #4df4c92b}button:disabled{opacity:.5;cursor:wait}.app{width:min(100%,470px);height:min(100dvh,860px);min-height:500px;position:relative;overflow:hidden;background:#081725;border:1px solid #234656}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;background:linear-gradient(#030e20ed,transparent);pointer-events:none}.topline{display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.1em;color:#7fe5d8}.hud button{pointer-events:auto;padding:7px 12px}.stats{display:flex;justify-content:space-between;margin-top:8px}.lives{color:#ff6f96;font-size:19px;max-width:240px;line-height:1.1;overflow-wrap:anywhere}.progress-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:#b2dbd6}.progress-track{height:6px;margin-top:5px;background:#ffffff18;border-radius:8px;overflow:hidden}.progress-track i{display:block;height:100%;background:#64efd0;transition:width .15s;width:0}.bossbar{display:none;margin-top:12px;height:5px;background:#543b32;border-radius:5px}.bossbar i{display:block;height:100%;background:#ffb261}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:25px;background:linear-gradient(#0413239c,#031322ef);overflow:auto}.card{text-align:center;width:100%;max-width:365px;padding:25px 15px}.eyebrow{color:#74e5d4;text-transform:uppercase;font-size:11px;letter-spacing:.18em}h1{font-size:35px;line-height:1.04;margin:12px 0;text-transform:uppercase;letter-spacing:-.04em}h1 span{color:#74e5d4}h2{font-size:28px;line-height:1.15;margin:12px 0}.hero{height:155px;position:relative;margin:12px auto}.hero .planet{width:155px;height:155px;object-fit:contain}.hero .emblem{position:absolute;width:52px;height:72px;object-fit:contain;left:50%;top:41px;transform:translateX(-50%);filter:drop-shadow(0 0 6px #7fffe9);z-index:1}.hero .ship{position:absolute;width:95px;right:20px;bottom:-10px;transform:rotate(-22deg)}p{color:#b5cbd8;line-height:1.5;font-size:14px}.buttons{display:grid;gap:10px;margin:20px 0}.row{display:flex;gap:8px;justify-content:center}.row button{font-size:12px;padding:10px}.note{font-size:11px;color:#859eaf}.record{font-size:13px;color:#ffd692}.hidden{display:none!important}.instructions{text-align:left;font-size:14px;color:#c9dfeb;line-height:1.7}.instructions li{margin-bottom:8px}select{padding:10px;border-radius:10px;background:#102e40;color:white;border:1px solid #345467;width:100%}.toast{position:absolute;bottom:75px;left:10%;right:10%;text-align:center;color:#72ffe0;pointer-events:none;font-weight:700}.credits{font-size:11px;color:#6d8d9e;margin-top:25px}@media(max-height:700px){.hero{height:105px}.hero .planet{width:105px;height:105px}.hero .ship{width:75px}.hero .emblem{width:36px;height:50px;top:27px}h1{font-size:29px}.card{padding:5px}.buttons{margin:12px 0}.credits{margin-top:12px}}
</style><link rel="stylesheet" href="../../experiencias.css"></head><body><main data-experience="Defensa" class="app"><canvas id="game" aria-label="Juego espacial. Mueve la nave arrastrando el dedo o con las flechas del teclado."></canvas><div class="hud hidden" id="hud"><div class="topline"><span id="stageLabel">ETAPA 1 / 5</span><button id="pause" aria-label="Pausar">Ⅱ</button></div><div class="stats"><span id="lives" class="lives"></span><strong id="score">0</strong></div><div class="progress-meta"><span id="progressLabel">OLEADA</span><span id="remaining">Faltan 40</span></div><div class="progress-track" role="progressbar" aria-label="Progreso de la etapa" aria-valuemin="0" aria-valuemax="100" id="progressTrack"><i id="progressFill"></i></div><div id="bossbar" class="bossbar"><i id="bossfill"></i></div></div><div class="toast" id="toast"></div><section class="panel" id="panel"><div class="card" id="card"></div></section></main><script src="audio.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),W=450,H=760;
let ready=false,state='menu',stage=1,lives=3,score=0,kills=0,resolved=0,spawned=0,spawnClock=0,fireClock=0,stageTime=0,invincible=0,shield=false,doubleTime=0,bossSpawned=false,bossDefeated=false,practice=false,shipX=W/2,targetX=W/2,bullets=[],rocks=[],powers=[],particles=[],last=0,toastTime=0,countdown=0,keys={};
let best=0;try{best=Number(localStorage.getItem('almendrino-best')||0)}catch(e){}
const names=['Órbita Almendrina','Lluvia de Meteoritos','Tormenta Espacial','Cinturón del Caos','Defensa Final'];
const cfg=[{goal:40,rate:1.1,speed:65},{goal:70,rate:.85,speed:95},{goal:110,rate:.72,speed:145},{goal:160,rate:.58,speed:195},{goal:200,rate:.24,speed:245}];
const images={};const files=['ship','planet','small','medium','large','boss','background','shield','double','bullet','emblem'];
const load=Promise.all(files.map(name=>new Promise(resolve=>{const im=new Image();im.onload=()=>{images[name]=im;resolve()};im.onerror=()=>resolve();im.src='assets/'+name+'.png'})));
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}window.addEventListener('resize',resize);resize();
function panel(html){$('card').innerHTML=html;$('panel').classList.remove('hidden');audioSystem.bind()}
function menu(){state='menu';$('hud').classList.add('hidden');$('bossbar').style.display='none';$('toast').textContent='';panel(`<div class="eyebrow">Feria Científica 2026<br>Liceo Los Almendros</div><div class="hero"><img class="planet" src="assets/planet.png" alt="Planeta Almendrino"><img class="emblem" src="assets/emblem.png" alt="Insignia del Liceo Los Almendros"><img class="ship" src="assets/ship.png" alt="Nave Almendrina"></div><h1>Defensa del<br><span>Planeta Almendrino</span></h1><p>Cinco etapas. Una misión: proteger nuestro planeta.</p><div class="buttons"><button class="primary" id="play" ${ready?'':'disabled'}>${ready?'¡Defender Almendrino!':'Preparando la nave…'}</button><div class="row"><button id="help">Cómo jugar</button></div></div>${audioSystem.controls()}<div class="record">Récord personal: ${best.toLocaleString('es-CL')}</div>`);$('play').onclick=()=>start(1,false);$('help').onclick=help}
function help(){panel(`<div class="eyebrow">Manual del piloto</div><h2>Protege el planeta</h2><ul class="instructions"><li>Arrastra por la pantalla para mover la nave. En computador usa las flechas o el ratón.</li><li>La nave dispara automáticamente.</li><li>Cada meteorito que golpea la nave o cruza la línea inferior resta una vida.</li><li>Recoge el <b>insignia del liceo</b> para resistir un impacto contra la nave.</li><li>Recoge las <b>dos flechas</b> para disparar doble durante 8 segundos.</li><li>Empiezas con 3 vidas. Superar las etapas 1 a 4 añade 1, 2, 3 y 4 vidas.</li><li>Destruye las oleadas. En la quinta etapa también debes vencer al meteorito gigante.</li></ul><button class="primary" id="back">Entendido</button>`);$('back').onclick=menu}
function start(n,trial){audioSystem.unlock();practice=trial;stage=n;score=0;lives=3+n*(n-1)/2;shipX=targetX=W/2;nextStage()}
function nextStage(){kills=resolved=spawned=0;spawnClock=.6;fireClock=0;stageTime=0;invincible=1;shield=false;doubleTime=0;bossSpawned=bossDefeated=false;bullets=[];rocks=[];powers=[];particles=[];countdown=3;state='countdown';$('panel').classList.add('hidden');$('hud').classList.remove('hidden');$('bossbar').style.display='none';hud()}
function hud(){$('stageLabel').textContent=`ETAPA ${stage} / 5${practice?' · ENSAYO':''}`;$('lives').textContent=lives<=8?'♥ '.repeat(lives):`♥ × ${lives}`;$('score').textContent=score.toLocaleString('es-CL');progress();}
function progress(){const total=cfg[stage-1].goal,n=Math.min(total,resolved),pct=Math.round(n/total*100);$('progressFill').style.width=pct+'%';$('progressTrack').setAttribute('aria-valuenow',pct);$('progressLabel').textContent=bossSpawned?'OLEADA COMPLETADA · JEFE FINAL':`OLEADA ${n} / ${total}`;$('remaining').textContent=bossSpawned?'Destruye al gigante':`Faltan ${total-n}`;}
function toast(s){$('toast').textContent=s;toastTime=2}
function burst(x,y,color='#ffb250',number=18){for(let i=0;i<number;i++){let a=Math.random()*Math.PI*2,v=40+Math.random()*130;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.4,color})}}
function damage(){audioSystem.effect('hit');lives--;invincible=1.3;burst(shipX,H-105,'#66dfef');hud();if(lives<=0)finish(false)}
function finish(win){audioSystem.effect(win?'win':'lose');state=win?'win':'over';if(!practice&&score>best){best=score;try{localStorage.setItem('almendrino-best',String(best))}catch(e){}}$('toast').textContent='';panel(`<div class="eyebrow">${practice?'Resultado de ensayo':'Defensa del Planeta Almendrino'}</div><h2>${win?'🏆 ¡Has salvado el Planeta Almendrino!':'La defensa ha caído'}</h2><p>${win?'Defensa total completada.':'El planeta necesita otro intento.'}</p><div class="record">${score.toLocaleString('es-CL')} puntos · Etapa ${stage}/5</div><div class="buttons"><button class="primary" id="again">${practice?'Repetir ensayo':'Jugar otra vez'}</button><button id="home">Volver al inicio</button></div>`);$('again').onclick=()=>start(practice?stage:1,practice);$('home').onclick=menu}
function cleared(){if(stage===5){finish(true);return}state='transition';audioSystem.effect('clear');lives+=stage;hud();panel(`<div class="eyebrow">${names[stage-1]}</div><h2>¡Etapa ${stage} superada!</h2><div style="font-size:45px;color:#ff7a99">♥</div><h2>+${stage} ${stage===1?'vida':'vidas'}</h2><p>${lives} vidas disponibles · ${score} puntos</p><p>Siguiente: <b>${names[stage]}</b></p><button class="primary" id="continue">Continuar</button>`);$('continue').onclick=()=>{stage++;nextStage()}}
function pause(){if(state==='playing'||state==='countdown'){const prev=state;state='paused';panel(`<div class="eyebrow">Respira, piloto</div><h2>Partida en pausa</h2>${audioSystem.controls()}<div class="buttons"><button class="primary" id="resume">Continuar</button><button id="exit">Salir al inicio</button></div>`);$('resume').onclick=()=>{audioSystem.unlock();state=prev;$('panel').classList.add('hidden')};$('exit').onclick=()=>{if(confirm('¿Salir y abandonar esta partida?'))menu()}}else if(state==='paused')$('resume').click()}
$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function spawn(){const c=cfg[stage-1],type=stage===1?0:stage===2?Math.floor(Math.random()*2):(stage===4?(Math.random()<.60?2:1):stage===3?(Math.random()<.45?2:Math.floor(Math.random()*2)):Math.floor(Math.random()*3)),size=[32,48,67][type];rocks.push({x:size+Math.random()*(W-size*2),y:-size,size,type,hp:(stage===4?[1,3,5]:[1,2,4])[type],speed:c.speed*(.8+Math.random()*.4),vx:stage>1?(Math.random()-.5)*(stage*20):0,angle:Math.random()*6,spin:(Math.random()-.5)*.6,boss:false});spawned++}
function update(dt){if(state==='countdown'){countdown-=dt;if(countdown<=0)state='playing';return}if(state!=='playing')return;stageTime+=dt;invincible=Math.max(0,invincible-dt);doubleTime=Math.max(0,doubleTime-dt);if(keys.ArrowLeft||keys.a)targetX-=260*dt;if(keys.ArrowRight||keys.d)targetX+=260*dt;targetX=Math.max(32,Math.min(W-32,targetX));shipX+=(targetX-shipX)*Math.min(1,dt*18);fireClock-=dt;if(fireClock<=0){fireClock=.16;audioSystem.effect('shot');for(const dx of doubleTime>0?[-14,14]:[0])bullets.push({x:shipX+dx,y:H-140})}spawnClock-=dt;const c=cfg[stage-1];if(spawned<c.goal&&spawnClock<=0){spawn();spawnClock=c.rate*(stage===4?(.8+.4*Math.sin(stageTime*.4)**2):1)}if(stage===5&&spawned>=c.goal&&!bossSpawned&&rocks.length===0){bossSpawned=true;rocks.push({x:W/2,y:-130,size:150,type:3,hp:105,maxhp:105,speed:22,vx:0,angle:0,spin:.05,boss:true});$('bossbar').style.display='block';progress();toast('¡Meteorito gigante en aproximación!')}if(stage===5&&bossSpawned&&!bossDefeated&&spawnClock<=0){spawn();spawnClock=.65}
for(let bi=bullets.length-1;bi>=0;bi--){let b=bullets[bi];b.y-=570*dt;if(b.y< -30){bullets.splice(bi,1);continue}for(let ri=rocks.length-1;ri>=0;ri--){let r=rocks[ri];if(Math.hypot(b.x-r.x,b.y-r.y)<r.size*.43){bullets.splice(bi,1);r.hp--;burst(b.x,b.y,'#9fffe9',3);if(r.boss)$('bossfill').style.width=(r.hp/r.maxhp*100)+'%';if(r.hp<=0){audioSystem.effect('hit');burst(r.x,r.y,'#ffbd65',r.boss?70:20);score+=r.boss?1500:[10,25,50][r.type];kills++;rocks.splice(ri,1);if(r.boss)bossDefeated=true;else resolved++;if(!r.boss&&stage>1&&Math.random()<.15)powers.push({x:r.x,y:r.y,type:Math.random()<.5?'shield':'double'});hud()}break}}}
for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];r.y+=r.speed*dt;r.x+=r.vx*dt;r.angle+=r.spin*dt;if(r.boss)r.x=W/2+Math.sin(stageTime*.7)*100;else if(r.x<r.size/2||r.x>W-r.size/2)r.vx*=-1;if(Math.hypot(r.x-shipX,r.y-(H-100))<r.size*.4+20){rocks.splice(i,1);if(!r.boss){resolved++;progress();}if(r.boss){finish(false);return}if(shield){shield=false;burst(r.x,r.y,'#64ffe0');toast('Escudo consumido')}else if(invincible<=0)damage();if(state!=='playing')return}else if(r.y-r.size/2>H-55){rocks.splice(i,1);if(!r.boss){resolved++;progress();}if(r.boss){finish(false);return}damage();if(state!=='playing')return}}
for(let i=powers.length-1;i>=0;i--){let p=powers[i];p.y+=95*dt;if(Math.hypot(p.x-shipX,p.y-(H-100))<40){audioSystem.effect('power');if(p.type==='shield'){shield=true;toast('Escudo activado')}else{doubleTime=8;toast('Disparo doble · 8 segundos')}powers.splice(i,1)}else if(p.y>H)powers.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').textContent=''}if(stage<5&&spawned>=c.goal&&rocks.length===0)cleared();if(stage===5&&bossDefeated&&rocks.length===0)cleared()}
function drawImage(name,x,y,w,h,angle=0){let im=images[name];if(!im)return;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);if(images.background)ctx.drawImage(images.background,0,0,W,H);else{ctx.fillStyle='#071725';ctx.fillRect(0,0,W,H)}drawImage('planet',W/2,H+70,330,330);if(['playing','countdown','paused','transition','over','win'].includes(state)){ctx.strokeStyle='#54d0bc55';ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(0,H-55);ctx.lineTo(W,H-55);ctx.stroke();ctx.setLineDash([]);for(const r of rocks)drawImage(['small','medium','large','boss'][r.type],r.x,r.y,r.size*1.2,r.size*1.2,r.angle);for(const b of bullets)drawImage('bullet',b.x,b.y,14,34);for(const p of powers){if(p.type==='double')drawImage('double',p.x,p.y,38,38);else{ctx.save();ctx.shadowColor='#6effee';ctx.shadowBlur=12;drawImage('emblem',p.x,p.y,36,50);ctx.restore()}}if(shield)drawImage('shield',shipX,H-100,95,95);if(invincible<=0||Math.floor(invincible*12)%2===0)drawImage('ship',shipX,H-100,70,86);for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(state==='countdown'){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 72px system-ui';ctx.fillText(Math.ceil(countdown),W/2,H/2);ctx.font='18px system-ui';ctx.fillText(names[stage-1],W/2,H/2+40)}}}
function frame(t){const dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();requestAnimationFrame(frame)}
function pointer(e){const r=canvas.getBoundingClientRect();targetX=(e.clientX-r.left)/r.width*W}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Escape'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='Escape'&&!e.repeat)pause()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};pause()});menu();load.then(()=>{ready=true;if(state==='menu')menu()});requestAnimationFrame(frame);
</script></body></html>
